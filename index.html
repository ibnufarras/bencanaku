<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bencanaku — Informasi Kebencanaan Indonesia</title>

    <meta
        name="description"
        content="Bencanaku menyatukan informasi kebencanaan Indonesia menjadi informasi yang sederhana dan mudah dipahami."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: white;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .container {

            max-width: 800px;

            text-align: center;

        }

        .badge {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 999px;

            background: #16251d;

            color: #5de38b;

            font-size: 13px;

            margin-bottom: 25px;

        }

        h1 {

            font-size: clamp(
                48px,
                10vw,
                90px
            );

            letter-spacing: -4px;

            margin-bottom: 15px;

        }

        .tagline {

            font-size: 22px;

            color: #aeb7c2;

            line-height: 1.5;

            margin-bottom: 35px;

        }

        .description {

            max-width: 600px;

            margin: auto;

            color: #727d89;

            line-height: 1.7;

        }

        .founder {

            margin-top: 70px;

            color: #59636f;

            font-size: 12px;

        }

        .founder strong {

            color: #909aa6;

        }

    </style>

</head>


<body>

    <main class="container">

        <div class="badge">
            INDONESIA DISASTER INFORMATION
        </div>


        <h1>
            Bencanaku
        </h1>


        <p class="tagline">

            Tahu apa yang terjadi.
            <br>

            Tahu apa artinya untukmu.

        </p>


        <p class="description">

            Bencanaku sedang dibangun sebagai
            platform informasi kebencanaan yang
            menyatukan berbagai sumber data
            menjadi informasi yang sederhana,
            kontekstual, dan mudah dipahami.

        </p>


        <div class="founder">

            Founded by
            <strong>Ibnu Farras</strong>

        </div>

    </main>

</body>

</html>
